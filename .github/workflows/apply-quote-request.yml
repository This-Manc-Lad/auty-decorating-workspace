# Triggered once to apply the client quote request source patch.
name: Apply quote request patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-quote-request.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch source files
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          main_path = Path('src/main.js')
          main = main_path.read_text()

          if 'CLIENT_QUOTE_REQUEST_ROOMS' not in main:
              main = main.replace('  CALENDAR_TYPES,\n', '  CALENDAR_TYPES,\n  CLIENT_QUOTE_REQUEST_ROOMS,\n')

          function_block = r'''
function buildQuotationRequestEmail(settings = {}, recipientName = "") {
  const businessName = settings.businessName || "AUTY Decorating";
  const decoratorName = settings.decoratorName || businessName;
  const greetingName = recipientName.trim() || "there";
  const roomLines = CLIENT_QUOTE_REQUEST_ROOMS.map((room) => `- [ ] ${room}`).join("\n");
  const body = [
    `Hi ${greetingName},`,
    "",
    `Thanks for getting in touch with ${businessName}. To help me prepare an accurate quotation, please reply with the details below.`,
    "",
    "Your details",
    "Full name:",
    "Email address:",
    "Phone number:",
    "Job address and postcode:",
    "",
    "Rooms you would like quoted",
    roomLines,
    "",
    "Decorating type",
    "- [ ] Painting",
    "- [ ] Wallpapering",
    "- [ ] Combination",
    "",
    "Materials",
    "- [ ] I will provide my own materials",
    "- [ ] Please include decorator-supplied materials in the quote",
    "- [ ] I am not sure yet",
    "",
    "Preferred start date",
    "Preferred start date:",
    "",
    "Anything else I should know?",
    "Notes:",
    "",
    "If useful, please also reply with photos of the rooms or areas you would like decorated.",
    "",
    "Kind regards,",
    decoratorName,
    businessName
  ].join("\n");
  return {
    subject: `Quotation request from ${businessName}`,
    body
  };
}

function QuotationRequestPanel({ settings, setNotice, compact = false }) {
  const [request, setRequest] = useState({ email: "", name: "" });
  const content = buildQuotationRequestEmail(settings, request.name);
  const recipientEmail = request.email.trim();
  const mailto = recipientEmail ? `mailto:${encodeURIComponent(recipientEmail)}?subject=${encodeURIComponent(content.subject)}&body=${encodeURIComponent(content.body)}` : "";
  const openEmailRequest = (event) => {
    if (!recipientEmail) {
      event.preventDefault();
      setNotice("Add the potential client email first");
      return;
    }
    setNotice("Email request opened. If nothing appears, use Copy Request Text.");
  };
  const copyRequestText = async () => {
    const text = `${content.subject}\n\n${content.body}`;
    try {
      await navigator.clipboard.writeText(text);
      setNotice("Quote request copied");
    } catch (error) {
      window.prompt("Copy this quote request", text);
    }
  };
  const includedItems = [
    "Contact details",
    "Job address",
    "Top room choices + Other",
    "Paint / Wallpaper / Combination",
    "Materials supplied by client or decorator",
    "Preferred start date"
  ];
  return h("div", { className: classNames(compact ? "" : "mt-5", "overflow-hidden rounded-[28px] border border-white/70 bg-white/36 p-4 shadow-[0_22px_55px_rgba(41,62,72,0.14)]"), "data-quote-request-panel": "true" },
    h("div", { className: "flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between" },
      h("div", null,
        h("p", { className: "text-xs font-bold uppercase tracking-[0.22em] text-auty-gold" }, "Before the quote"),
        h("h2", { className: "mt-1 text-2xl text-slate-950" }, "Client Quote Request"),
        h("p", { className: "mt-2 max-w-xl text-sm leading-6 text-slate-600" }, "Send a simple questionnaire to a potential customer so they can reply with the details you need before building a quote.")
      ),
      h("div", { className: "rounded-full border border-white/80 bg-white/55 px-4 py-2 text-xs font-bold text-auty-teal shadow-sm" }, "Email ready")
    ),
    h("div", { className: "mt-4 grid gap-4 sm:grid-cols-2" },
      h(Field, { label: "Potential Client Email", type: "email", value: request.email, onChange: (value) => setRequest({ ...request, email: value }) }),
      h(Field, { label: "Client Name (optional)", value: request.name, onChange: (value) => setRequest({ ...request, name: value }) })
    ),
    !compact && h("div", { className: "mt-4 rounded-[24px] border border-white/70 bg-white/42 p-4" },
      h("p", { className: "text-xs font-bold uppercase tracking-[0.2em] text-slate-500" }, "Questionnaire includes"),
      h("div", { className: "mt-3 grid gap-2 sm:grid-cols-2" },
        includedItems.map((item) => h("div", { key: item, className: "rounded-full border border-white/70 bg-white/55 px-3 py-2 text-xs font-semibold text-slate-700" }, item))
      )
    ),
    h("details", { className: "mt-4 rounded-[24px] border border-white/70 bg-white/30 p-4 text-sm text-slate-700" },
      h("summary", { className: "cursor-pointer font-semibold text-slate-900" }, "Preview request wording"),
      h("pre", { className: "mt-3 max-h-72 overflow-auto whitespace-pre-wrap rounded-[20px] bg-white/70 p-4 text-xs leading-5 text-slate-700" }, content.body)
    ),
    h("div", { className: "mt-4 grid gap-3 sm:grid-cols-2" },
      h("a", {
        href: mailto || "#",
        role: "button",
        onClick: openEmailRequest,
        "data-quote-request-subject": content.subject,
        "data-quote-request-body": content.body,
        "data-quote-request-mailto": mailto,
        className: "inline-flex min-h-[54px] items-center justify-center gap-2 rounded-full bg-[#01717F] px-5 py-3 text-sm font-semibold text-white shadow-[0_16px_35px_rgba(1,113,127,0.24)] transition duration-300 hover:-translate-y-0.5 hover:bg-[#006878] active:scale-[0.98]"
      }, h(Mail, { size: 18 }), "Open Email Request"),
      h("button", {
        type: "button",
        onClick: copyRequestText,
        className: "inline-flex min-h-[54px] items-center justify-center gap-2 rounded-full border border-white/70 bg-white/62 px-5 py-3 text-sm font-semibold text-slate-800 shadow-sm transition duration-300 hover:-translate-y-0.5 hover:bg-white/80 active:scale-[0.98]"
      }, h(ClipboardList, { size: 18 }), "Copy Request Text")
    ),
    h("p", { className: "mt-3 text-center text-xs text-slate-500" }, "If the email app does not open, use Copy Request Text and paste it into an email.")
  );
}
'''
          if 'function buildQuotationRequestEmail' not in main:
              main = main.replace('\nfunction RoomQuoterPage(', function_block + '\nfunction RoomQuoterPage(')

          if 'h(QuotationRequestPanel, { settings: data.settings, setNotice }),' not in main:
              main = main.replace(
                  '        h(ActionButton, { label: "New Quote / Existing Client", onClick: () => setQuoteFlow("existing"), icon: Users, variant: "soft", className: "w-full" })\n      ),\n      quoteFlow === "new" &&',
                  '        h(ActionButton, { label: "New Quote / Existing Client", onClick: () => setQuoteFlow("existing"), icon: Users, variant: "soft", className: "w-full" })\n      ),\n      h(QuotationRequestPanel, { settings: data.settings, setNotice }),\n      quoteFlow === "new" &&'
              )

          if 'h(QuotationRequestPanel, { settings: data.settings, setNotice, compact: true }),' not in main:
              main = main.replace(
                  '  return h("div", { className: "grid gap-5 xl:grid-cols-[1.2fr_0.8fr]" },\n    h("section", { className: "space-y-5" },\n      h("div", { className: "rounded-[30px] border border-white/70 bg-white/82 p-5 shadow-[0_18px_45px_rgba(24,34,48,0.08)] backdrop-blur" },',
                  '  return h("div", { className: "grid gap-5 xl:grid-cols-[1.2fr_0.8fr]" },\n    h("section", { className: "space-y-5" },\n      h(QuotationRequestPanel, { settings: data.settings, setNotice, compact: true }),\n      h("div", { className: "rounded-[30px] border border-white/70 bg-white/82 p-5 shadow-[0_18px_45px_rgba(24,34,48,0.08)] backdrop-blur" },'
              )

          main_path.write_text(main)

          test_path = Path('tests/navigation.spec.js')
          test_text = test_path.read_text()
          if 'Client Quote Request' not in test_text:
              test_text = test_text.replace(
                  '  await expect(page.getByRole("button", { name: "New Quote / Existing Client" })).toBeVisible();\n  await expect(page.getByRole("heading", { name: "Room Woodwork" })).toHaveCount(0);',
                  '  await expect(page.getByRole("button", { name: "New Quote / Existing Client" })).toBeVisible();\n  await expect(page.getByRole("heading", { name: "Client Quote Request" })).toBeVisible();\n  await page.getByLabel("Potential Client Email").fill("sam@example.com");\n  await page.getByLabel("Client Name (optional)").fill("Sam");\n  const requestButton = page.getByRole("button", { name: "Open Email Request" });\n  await expect(requestButton).toHaveAttribute("data-quote-request-mailto", /sam%40example\\.com/);\n  await expect(requestButton).toHaveAttribute("data-quote-request-subject", /Quotation request from AUTY Decorating/);\n  const requestBody = await requestButton.getAttribute("data-quote-request-body");\n  expect(requestBody).toContain("Full name:");\n  expect(requestBody).toContain("Job address and postcode:");\n  expect(requestBody).toContain("Living Room");\n  expect(requestBody).toContain("Other");\n  expect(requestBody).toContain("Painting");\n  expect(requestBody).toContain("Wallpapering");\n  expect(requestBody).toContain("Combination");\n  expect(requestBody).toContain("I will provide my own materials");\n  expect(requestBody).toContain("Please include decorator-supplied materials in the quote");\n  expect(requestBody).toContain("Preferred start date:");\n  await expect(page.getByRole("heading", { name: "Room Woodwork" })).toHaveCount(0);'
              )
              test_path.write_text(test_text)
          PY

      - name: Build app
        run: |
          npm ci
          npm run build

      - name: Commit patched app source
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js tests/navigation.spec.js
          git commit -m "Add client quote request email"
          git push
